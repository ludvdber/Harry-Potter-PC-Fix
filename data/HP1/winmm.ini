;
;  Read by winmm.dll, next to the game's exe, once when the game starts.
;  1 = on, 0 = off. A line you delete falls back to its default; a missing
;  file means all defaults.
; ============================================================================


; ----------------------------------------------------------------------------
;  Window
; ----------------------------------------------------------------------------
[Accio.Window]

; Writes winmm_accio.log next to the game: the controllers found, and what
; was done with them.
Log=1

; The game's window has a title bar and a border: with a picture as large as
; the screen, the bottom went under the taskbar. 1 = a picture as large as
; the screen fills it, with no frame (taskbar hidden), without switching the
; display mode. A smaller picture stays a normal window. 0 = as shipped.
FillScreen=1

; Alt+Enter switches the game between window and full screen: its menu
; stays at the old size (too large, cut off) and the new size is written
; into HP.ini. 1 = Alt+Enter does nothing.
BlockAltEnter=0


; ----------------------------------------------------------------------------
;  Controller
; ----------------------------------------------------------------------------
[Accio.Controller]

; The game knows buttons by their number, and the numbers Accio Launcher binds
; are a PlayStation controller's. 1 = an Xbox controller is shown to the game
; with those numbers (A = cross, B = circle, X = square, Y = triangle, Back =
; Share, Start = Options, triggers = L2 and R2). 0 = as it is.
XboxLayout=0

; The key pressed by Share (Back on Xbox) and by Options (Start), held as long
; as the button: the game opens its map and its menu only from the keyboard.
; Windows key codes: 9 = Tab (map), 27 = Escape (menu). 0 = the button stays
; a button, for a binding in User.ini.
ShareKey=0
OptionsKey=0
