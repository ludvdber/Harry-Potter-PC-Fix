;
;  Read by dinput8.dll, next to the game's exe, once when the game starts.
;  1 = on, 0 = off. A line you delete falls back to its default; a missing
;  file means all defaults.
; ============================================================================


; ----------------------------------------------------------------------------
;  Controller
; ----------------------------------------------------------------------------
[Accio.Controller]

; Writes dinput8_accio.log next to the game: the controllers found, and what
; was done with them.
Log=1

; The game has no dead zone: a stick at rest is never exactly in the middle,
; and the character crept. Percent of the travel, each side of the middle,
; read as the middle; beyond it, the stick still reaches its edge. Both
; sticks, not the triggers. 0 = as shipped.
DeadZone=15

; The game knows buttons by their number, and the numbers Accio Launcher binds
; are a PlayStation controller's. 1 = an Xbox controller is shown to the game
; with that layout (A = cross, B = circle, X = square, Y = triangle, Back =
; Share, Start = Options, right stick and triggers where a PlayStation
; controller has them). 0 = as it is.
XboxLayout=1

; The key pressed by Share (Back on Xbox) and by Options (Start), held as long
; as the button. The game's menu opens on Escape and listens to no controller
; button: 27 = Escape opens it and closes it. Windows key codes; 0 = the
; button stays a button, for a binding in User.ini.
ShareKey=0
OptionsKey=27


; ----------------------------------------------------------------------------
;  Game
; ----------------------------------------------------------------------------
[Accio.Game]

; The game holds itself at 60 frames per second (its engine answers 60 when
; asked for its ceiling). This value replaces that ceiling in memory when the
; game starts, only if Engine.dll is the one read (nothing on disk). Try 120.
; Above 60 the game has two known bugs (a frozen imp, portraits that no longer
; open): an option to try. 30 to 1000; 0 = as shipped.
FrameRateCap=0


; ----------------------------------------------------------------------------
;  Frame counter and benchmark
; ----------------------------------------------------------------------------
; The game draws with Direct3D 8; this DLL watches its frames on their way to
; the screen. Same keys and files as the d3d9.ini of the other games.
[Accio.Overlay]

; Frames per second.
ShowFPS=0
; Time per frame, and the "1% low": the frame rate of the slowest 1% of
; frames, which is what you feel as stutter.
ShowFrameTime=0
; Graph of the last 240 frame times. Lines at 60 and 30 FPS; gold bars are on
; time for 60 FPS, orange for 30, red slower.
ShowGraph=0

; Key that shows or hides the panel, as a Windows virtual-key code (121 = F10,
; 0 = none). With every line above at 0, it shows the frame rate and the 1% low.
OverlayKey=121
; Key that starts a benchmark, and stops it when pressed again (122 = F11, 0 = none). At the end:
; average FPS, 1% and 0.1% low, worst frame, on screen for 15 seconds, and every
; frame time in the "benchmarks" folder next to the game.
BenchmarkKey=122
; Corner: 1 top left, 2 top right, 3 bottom left, 4 bottom right.
Position=1
; Size in percent (50 to 300).
Size=100


; ----------------------------------------------------------------------------
;  Screenshots
; ----------------------------------------------------------------------------
[Accio.Window]

; Key that saves the picture as PNG (123 = F12, 0 = none), without the panel.
ScreenshotKey=123
; Folder for the pictures. Accio Launcher writes its own here at each launch;
; empty = a "screenshots" folder next to the game.
ScreenshotFolder=
