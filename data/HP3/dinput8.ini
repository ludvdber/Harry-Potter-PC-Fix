; ----------------------------------------------------------------------------
;  Controller
; ----------------------------------------------------------------------------
[Accio.Controller]

; Writes dinput8_accio.log next to the game: the controllers found, and what
; was done with them.
Log=1

; The game has no dead zone: a stick at rest is never exactly in the middle,
; and the character crept. Percent of the travel, each side of the middle,
; read as the middle; beyond it, the stick still reaches its edge. Both
; sticks, not the triggers. 0 = as shipped.
DeadZone=15

; The game knows buttons by their number, and the numbers Accio Launcher binds
; are a PlayStation controller's. 1 = an Xbox controller is shown to the game
; with that layout (A = cross, B = circle, X = square, Y = triangle, Back =
; Share, Start = Options, right stick and triggers where a PlayStation
; controller has them). 0 = as it is.
XboxLayout=1

; The key pressed by Share (Back on Xbox) and by Options (Start), held as long
; as the button. The game's menu opens on Escape and listens to no controller
; button: 27 = Escape opens it and closes it. Windows key codes; 0 = the
; button stays a button, for a binding in User.ini.
ShareKey=0
OptionsKey=27
