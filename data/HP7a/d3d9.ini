; ----------------------------------------------------------------------------
;  Window, focus, mouse and keyboard
; ----------------------------------------------------------------------------
[Accio.Window]

; A window instead of exclusive full screen. Needed for everything below:
; in exclusive full screen, Alt+Tab freezes the game.
Windowed=1

; 1 = borderless, covering the whole monitor (recommended)
; 2 = ordinary window, 3 = resizable window, 4 = borderless, image size
WindowStyle=1

; Keeps the game running while another window is in front (Alt+Tab, a
; click on another monitor) instead of freezing it. Keyboard and mouse are
; taken back as soon as the game is in front again.
KeepRunningInBackground=1

; Placement of a window (styles 2 to 4).
CenterWindow=1
; 1 = always on the main monitor, 0 = the monitor the game opens on.
UsePrimaryMonitor=0
AlwaysOnTop=0

; The game was made before Windows display scaling. 0 keeps its original
; behaviour; 1 makes it ignore scaling (sharper at 125 % and up, but the
; window and menus may change size).
DPIAware=0

; Frame-rate limit (0 = none).
FPSLimit=60

; Screenshot key, as a Windows virtual-key code (123 = F12, 44 = Print
; Screen, 0 = none). Pictures go to the "screenshots" folder next to the
; game, or to ScreenshotFolder when it is set: Accio Launcher sets it to
; Pictures\Accio Launcher\<game>, so that uninstalling a game keeps them.
ScreenshotKey=123
;ScreenshotFolder=

; Back in front after Alt+Tab: keyboard and mouse taken back at once
; (without it, the keyboard stayed dead up to 30 seconds).
RetakeInputOnReturn=1
; A key you released while in another window is released for the game too
; (without it, Harry could keep walking on his own).
ReleaseKeysOnReturn=1

; Writes d3d9_accio.log next to the game: what the fix did, for bug reports.
Log=1


; ----------------------------------------------------------------------------
;  Performance overlay, like a benchmark tool. Each line has its own switch.
; ----------------------------------------------------------------------------
[Accio.Overlay]

; Frames per second.
ShowFPS=0
; Time per frame, and the "1% low": the frame rate of the slowest 1% of
; frames, which is what you feel as stutter.
ShowFrameTime=0
; Graph of the last 240 frame times. Lines at 60 and 30 FPS; gold bars are on
; time for 60 FPS, orange for 30, red slower.
ShowGraph=0
; Processor used by the game (share of the whole processor), and by its main
; thread alone (100% = one core full, the real limit of these games).
ShowCPU=0
; Graphics card load from this game (read from Windows).
ShowGPU=0
; Video memory used by this game.
ShowVRAM=0
; Memory used by this game.
ShowRAM=0
; Time from the moment the game reads a key you just pressed to the moment the
; resulting frame goes to the graphics card (the screen itself is not counted).
ShowLatency=0

; Key that shows or hides the panel, as a Windows virtual-key code (121 = F10,
; 0 = none). With every line above at 0, it shows the frame rate and the 1% low.
OverlayKey=121
; Key that starts a benchmark, and stops it when pressed again (122 = F11, 0 = none). At the end:
; average FPS, 1% and 0.1% low, worst frame, on screen for 15 seconds, and every
; frame time in the "benchmarks" folder next to the game.
BenchmarkKey=122
; Key that switches the image effects of this fix off and on, to compare the same
; picture with and without them (0 = none; 119 = F8). Anti-aliasing stays as it is.
CompareKey=0
; Corner: 1 top left, 2 top right, 3 bottom left, 4 bottom right.
Position=1
; Size in percent (50 to 300).
Size=100


; ----------------------------------------------------------------------------
;  Changes made inside the game
; ----------------------------------------------------------------------------
[Accio.Game]

; Aspect ratio of the image: 0 = as shipped, or a ratio such as 16:10,
; 21:9, 32:9, 2.37.
AspectRatio=0

; Field of view, as a factor: 1.7189 = as with the earlier fix.
; 0 = as shipped (narrower); higher widens it further.
FOV=1.7189

; The game holds itself to 30 frames per second, spinning a processor core
; while it waits. 1 skips that wait: FPSLimit above sets the pace (the game
; keeps its real speed, measured at 30 and 60). The earlier fix only did it
; while the 9 key was toggled.
UnlockFrameRate=1


; ----------------------------------------------------------------------------
;  Your own keys
; ----------------------------------------------------------------------------
[Accio.Keys]

; Action=key, or several keys: Action=key1,key2. Keys are named as printed on
; YOUR keyboard (Z, Q, 1...), or Space, Enter, Tab, LShift, LCtrl, LAlt,
; Up, Down, Left, Right, F1 to F12, Num0 to Num9, and MouseLeft, MouseRight,
; MouseMiddle, Mouse4, Mouse5. A key given to an action stops doing what it
; did before; every other key of the game keeps working.
;
; Name the game's key as Key.<its US-keyboard name>, e.g. Key.E=F.


; ----------------------------------------------------------------------------
;  Controller (read by xinput1_3.dll, next to the game)
; ----------------------------------------------------------------------------
[Accio.Controller]

; A PlayStation 4 or 5 controller plays like an Xbox controller, on the first
; place no Xbox controller holds. 0 = Xbox controllers only: use it if a tool
; such as Steam Input or DS4Windows already turns yours into an Xbox
; controller, or the game would see it twice.
PlayStation=1
; Vibration of a PlayStation controller (USB only).
Rumble=1
; Light bar of a PlayStation controller (USB only), as red,green,blue from 0
; to 255, e.g. 255,110,0. Empty = left as it is. Accio Launcher sets it to
; your house colours.
LightBar=


; ----------------------------------------------------------------------------
;  Image
;  All off: none of these effects has been tuned for this game yet.
; ----------------------------------------------------------------------------
[Accio.Graphics]

; Edge smoothing (FXAA) with light sharpening. Also required by ColorGrading,
; SSAO, Bloom and GodRays.
FXAA=0
Sharpness=0.40

; Multisample anti-aliasing: 0, 2, 4, 8 or 16 (stepped down if the graphics
; card cannot). Reaches the 3D scene only with SSAO=0: ambient occlusion reads
; the scene depth, which Direct3D 9 cannot multisample.
Antialiasing=0

; With Antialiasing: hair and leaves smoothed too (their cut-out edges).
; NVIDIA cards only, elsewhere no change. Costs frames where there are many
; leaves (HP6, 2560x1440, RTX 2060 SUPER: 1 % low 101 -> 76 FPS).
TransparencyAntialiasing=0

; Texture sharpness at an angle: 0, 2, 4, 8 or 16.
AnisotropicFiltering=0

; Negative = sharper distant textures (-1.0 is a good value), 0 = as shipped.
TextureLODBias=0

; Render larger, then scale down (supersampling): 1 = off, 1.5, 2 (up to 4). Very demanding:
; 2 draws four times the pixels, 1.5 a little over twice.
SSAAFactor=1

; Sharper shadows (1, 2 or 4). Experimental: also enlarges reflections.
ShadowMapScale=1

VSync=0

; Colour adjustments. SkinProtect (0 to 1) spares faces part of the contrast and vibrance;
; YellowRestraint (0 to 1) keeps yellows out of the vibrance and tones them down a little.
ColorGrading=0
Vibrance=0.25
Vignette=0.00
Lift=0.00
Gamma=1.00
Gain=1.00
Temperature=0.00
Tint=0.00
Contrast=0.00
SplitTone=0.00
SkinProtect=0.00
YellowRestraint=0.00

; Ambient occlusion (contact shadows), bloom and light shafts.
SSAO=0
SSAOStrength=0.50
SSAORadius=6.0
SSAOMinDelta=0.0005
SSAOMaxDelta=0.05
Bloom=0
BloomStrength=0.35
BloomThreshold=0.75
GodRays=0
GodRaysStrength=0.45
GodRaysDecay=0.96

; Size the image is drawn at. 0 = the size chosen in the game's options
; (recommended: another size can give characters a faint double).
; -1 = the monitor's own size.
RenderWidth=0
RenderHeight=0

; Most textures ship without mipmaps (smaller copies for the distance), which
; makes them shimmer and blur far away. 1 builds them when the game loads.
GenerateMipmaps=1
; How those copies are made: 0 = soft, 1 = sharp (keeps more detail far away).
MipmapFilter=0
; 1 = leaves, hair and fences keep their density in the distance instead of
; thinning out and vanishing.
MipmapCoverage=0
; Blends between those copies on every texture (trilinear filtering).
ForceTrilinear=1

; Frames the graphics driver may prepare in advance: 1 = least input delay,
; 0 = the driver's own choice.
MaxFrameLatency=1
