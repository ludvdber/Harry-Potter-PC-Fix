;
;  Read by winmm.dll, next to the game's exe, once when the game starts.
;  1 = on, 0 = off. A line you delete falls back to its default; a missing
;  file means all defaults.
; ============================================================================


; ----------------------------------------------------------------------------
;  Window
; ----------------------------------------------------------------------------
[Accio.Window]

; Writes winmm_accio.log next to the game: the controllers found, and what
; was done with them.
Log=1

; The game's window has a title bar and a border: with a picture as large as
; the screen, the bottom went under the taskbar. 1 = a picture as large as
; the screen fills it, with no frame (taskbar hidden), without switching the
; display mode. A smaller picture stays a normal window. 0 = as shipped.
FillScreen=1

; Alt+Enter switches the game between window and full screen: its menu
; stays at the old size (too large, cut off) and the new size is written
; into Game.ini. 1 = Alt+Enter does nothing.
BlockAltEnter=1

; Frame-rate limit of this fix, on top of the game's own (0 = none). The game
; already paces itself with the FPSLimit of its Game.ini.
FPSLimit=0

; Screenshot key, as a Windows virtual-key code (123 = F12, 44 = Print
; Screen, 0 = none). Pictures go to the "screenshots" folder next to the
; game, or to ScreenshotFolder when it is set: Accio Launcher sets it to
; Pictures\Accio Launcher\<game>, so that uninstalling a game keeps them.
ScreenshotKey=123
;ScreenshotFolder=

; Under Wine (Linux, Steam Deck) the launcher window that opens first is
; black, with only "Quitter" showing: a call centring its menu page on the
; screen throws the page out of the window. 1 = that call is ignored, in
; memory: the exe on disk is not changed. Does nothing under Windows.
; 0 = as shipped.
WineLauncherFix=1


; ----------------------------------------------------------------------------
;  Controller
; ----------------------------------------------------------------------------
[Accio.Controller]

; The game knows buttons by their number, and the numbers Accio Launcher binds
; are a PlayStation controller's. 1 = an Xbox controller is shown to the game
; with those numbers (A = cross, B = circle, X = square, Y = triangle, Back =
; Share, Start = Options, triggers = L2 and R2). 0 = as it is.
XboxLayout=1

; The key pressed by Share (Back on Xbox) and by Options (Start), held as long
; as the button: the game opens its map and its menu only from the keyboard.
; Windows key codes: 9 = Tab (map), 27 = Escape (menu). 0 = the button stays
; a button, for a binding in User.ini.
ShareKey=0
OptionsKey=27


; ----------------------------------------------------------------------------
;  Performance overlay, like a benchmark tool. Each line has its own switch.
; ----------------------------------------------------------------------------
[Accio.Overlay]

; Frames per second.
ShowFPS=0
; Time per frame, and the "1% low": the frame rate of the slowest 1% of
; frames, which is what you feel as stutter.
ShowFrameTime=0
; Graph of the last 240 frame times. Lines at 60 and 30 FPS; gold bars are on
; time for 60 FPS, orange for 30, red slower.
ShowGraph=0
; Processor used by the game (share of the whole processor), and by its main
; thread alone (100% = one core full, the real limit of these games).
ShowCPU=0
; Graphics card load from this game (read from Windows).
ShowGPU=0
; Video memory used by this game.
ShowVRAM=0
; Memory used by this game.
ShowRAM=0
; Time from the moment a key you just pressed reaches the game to the moment
; the next frame goes to the graphics card (the screen itself is not counted).
ShowLatency=0

; Key that shows or hides the panel, as a Windows virtual-key code (121 = F10,
; 0 = none). With every line above at 0, it shows the frame rate and the 1% low.
OverlayKey=121
; Key that starts a benchmark, and stops it when pressed again (122 = F11, 0 = none). At the end:
; average FPS, 1% and 0.1% low, worst frame, on screen for 15 seconds, and every
; frame time in the "benchmarks" folder next to the game.
BenchmarkKey=122
; Corner: 1 top left, 2 top right, 3 bottom left, 4 bottom right.
Position=1
; Size in percent (50 to 300).
Size=100


; ----------------------------------------------------------------------------
;  Lumos
; ----------------------------------------------------------------------------
[Accio.Lumos]

; With Lumos, the walls near the wand should fade out and show what they hide.
; They stayed solid: the game's Render.dll reads the wand's switch and radius
; one slot short, and its renderer ignores the fade the engine computes. 1 =
; both corrected in memory when the game starts (nothing on disk). 0 = as
; shipped.
LumosFade=1

; Writes every Lumos surface to winmm_accio.log (large). For a report.
LumosLog=0
