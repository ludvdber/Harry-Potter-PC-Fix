# Compiles the fix (Release | Win32), runs its tests, and uploads data/d3d9.dll,
# data/xinput1_3.dll (the controller DLL), data/winmm.dll (HP1, HP2) and data/dinput8.dll (HP3)
# as an artifact together with their SHA-256.
#
# Also called by release.yml (workflow_call), so the build is described in one place only.
name: Build

on:
  push:
  pull_request:
  workflow_call:
    outputs:
      sha256:
        description: SHA-256 of data/d3d9.dll
        value: ${{ jobs.build.outputs.sha256 }}
      xinput-sha256:
        description: SHA-256 of data/xinput1_3.dll
        value: ${{ jobs.build.outputs.xinput-sha256 }}
      winmm-sha256:
        description: SHA-256 of data/winmm.dll
        value: ${{ jobs.build.outputs.winmm-sha256 }}
      dinput8-sha256:
        description: SHA-256 of data/dinput8.dll
        value: ${{ jobs.build.outputs.dinput8-sha256 }}
      artifact-name:
        description: Name of the artifact holding d3d9.dll, xinput1_3.dll, winmm.dll, dinput8.dll and their .sha256
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    name: Release | Win32
    runs-on: windows-latest
    # A run made pointless by a newer push on the same branch is cancelled. On the job,
    # not the workflow, so it also holds when release.yml calls this file; there
    # github.workflow is "Release": its own group, and nothing is cancelled.
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
      xinput-sha256: ${{ steps.verify.outputs.xinput-sha256 }}
      winmm-sha256: ${{ steps.verify.outputs.winmm-sha256 }}
      dinput8-sha256: ${{ steps.verify.outputs.dinput8-sha256 }}
      artifact-name: d3d9-win32
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version lives in VERSION (read by release.yml for the tag) and in
      # source/version.h (written into the DLL). They must agree.
      - name: Check the version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $header = Get-Content -Raw source/version.h
          if ($header -notmatch '#define ACCIO_VERSION_STR "([0-9.]+)"') {
            Write-Output '::error file=source/version.h::ACCIO_VERSION_STR not found.'
            exit 1
          }
          if ($Matches[1] -ne $version) {
            Write-Output "::error file=source/version.h::ACCIO_VERSION_STR is $($Matches[1]), VERSION is $version."
            exit 1
          }
          $numbers = $version -replace '\.', ','
          if ($header -notmatch "#define ACCIO_VERSION_NUM $numbers,0") {
            Write-Output "::error file=source/version.h::ACCIO_VERSION_NUM must be $numbers,0."
            exit 1
          }
          Write-Output "Version $version"

      # data/<game>/d3d9.ini, winmm.ini and dinput8.ini are generated by tools/make_ini.py; a file
      # edited by hand, or a script changed without regenerating, fails here.
      - name: Check the ini files
        shell: pwsh
        run: |
          python tools/make_ini.py --check
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::error::data/*/*.ini differ from tools/make_ini.py. Run python tools/make_ini.py and commit.'
            exit 1
          }

      # The project uses the v143 toolset (Visual Studio 2022): prefer a VS 2022
      # instance, otherwise take the newest one.
      - name: Locate Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -products * -version '[17.0,18.0)' -requires Microsoft.Component.MSBuild -latest -property installationPath
          if (-not $vs) {
            $vs = & $vswhere -products * -requires Microsoft.Component.MSBuild -latest -property installationPath
          }
          $msbuild = if ($vs) { Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe' }
          if (-not $msbuild -or -not (Test-Path -LiteralPath $msbuild)) {
            Write-Output '::error::MSBuild not found on this runner.'
            exit 1
          }
          Write-Output "Using $vs"
          "path=$vs" >> $env:GITHUB_OUTPUT
          "msbuild=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Build (Release | Win32)
        shell: pwsh
        env:
          MSBUILD: ${{ steps.vs.outputs.msbuild }}
        run: |
          & $env:MSBUILD build\accio-fix.sln /p:Configuration=Release /p:Platform=Win32 /m /nologo /v:minimal /warnaserror
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Build failed (MSBuild exit code $LASTEXITCODE)."
            exit 1
          }

      # Every DLL that d3d9.dll imports must exist on the player's PC, or the game
      # stops before its first frame ("xxx.dll was not found"). A switch to the DLL
      # runtime (/MD: VCRUNTIME140.dll, MSVCP140.dll), a Debug build (…D.dll) or
      # a new library would pass every other step and fail only at the player's.
      # Only parts of Windows are allowed, all of which Wine has too. d3dx9_43.dll
      # is not one of them (the DirectX End-User Runtime, never shipped with
      # Windows): the fix stopped needing it on 2026-09-27, and must not again.
      # Adding a name here is a decision. xinput1_3.dll (the controller DLL) reads
      # PlayStation pads through setupapi.dll and hid.dll, both part of Windows. winmm.dll (HP1, HP2)
      # and dinput8.dll (HP3) load Windows' own by its full path and need nothing else.
      - name: Check the imported DLLs
        shell: pwsh
        env:
          VS: ${{ steps.vs.outputs.path }}
        run: |
          $dumpbin = Get-ChildItem "$env:VS\VC\Tools\MSVC\*\bin\Hostx64\x86\dumpbin.exe" | Select-Object -Last 1
          if (-not $dumpbin) { Write-Output '::error::dumpbin not found.'; exit 1 }
          $checks = @(
            @{ dll = 'd3d9.dll'; project = 'accio-fix'; allowed = 'kernel32.dll','user32.dll','gdi32.dll','winmm.dll','ole32.dll' }
            @{ dll = 'xinput1_3.dll'; project = 'accio-xinput'; allowed = 'kernel32.dll','setupapi.dll','hid.dll' }
            @{ dll = 'winmm.dll'; project = 'accio-winmm'; allowed = 'kernel32.dll','user32.dll' }
            @{ dll = 'dinput8.dll'; project = 'accio-dinput8'; allowed = 'kernel32.dll','user32.dll' }
          )
          foreach ($c in $checks) {
            $out = & $dumpbin.FullName /nologo /dependents "data\$($c.dll)"
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::dumpbin failed on $($c.dll)."; exit 1 }
            $names = $out | Select-String -Pattern '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value.ToLowerInvariant() }
            if (-not $names) { Write-Output "::error::No imported DLL found for $($c.dll)."; exit 1 }
            $extra = $names | Where-Object { $_ -notin $c.allowed }
            if ($extra) {
              Write-Output ("::error file=build/$($c.project).vcxproj::$($c.dll) imports " + ($extra -join ', ') + ', not in the allowed list. A player without it cannot start the game.')
              exit 1
            }
            Write-Output ("$($c.dll) imports: " + ($names -join ', '))
          }

      # Key remapping ([Accio.Keys]) checked without a game (the test program is
      # named like HP4's executable because the action names are HP4's), then each
      # game's d3d9.ini read with the DLL's own reader, old file format included.
      - name: Tests
        shell: cmd
        env:
          VS: ${{ steps.vs.outputs.path }}
        run: |
          call "%VS%\VC\Auxiliary\Build\vcvars32.bat" >nul || exit /b 1
          cd tests
          if not exist out mkdir out
          cl /nologo /std:c++20 /EHsc /W4 /WX /I..\source keys_test.cpp ..\source\keys.cpp /Feout\gof_f.exe /Foout\ user32.lib dxguid.lib || exit /b 1
          out\gof_f.exe "%CD%\out\keys_test.ini"
          cl /nologo /std:c++20 /EHsc /W4 /WX /I..\source settings_test.cpp ..\source\settings.cpp /Feout\settings_test.exe /Foout\ || exit /b 1
          out\settings_test.exe "%CD%\..\data" "%CD%\out" || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /WX /I..\source mipmaps_test.cpp ..\source\mipmaps.cpp /Feout\mipmaps_test.exe /Foout\ || exit /b 1
          out\mipmaps_test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /WX /I..\source xinput_test.cpp ..\source\xinput\pad.cpp /Feout\xinput_test.exe /Foout\ || exit /b 1
          out\xinput_test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /WX /I..\source winmm_test.cpp ..\source\winmm\remap.cpp /Feout\winmm_test.exe /Foout\ user32.lib || exit /b 1
          out\winmm_test.exe "%CD%\..\data\winmm.dll" || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /WX /I..\source dinput8_test.cpp ..\source\dinput8\pad.cpp /Feout\dinput8_test.exe /Foout\ user32.lib ole32.lib || exit /b 1
          out\dinput8_test.exe "%CD%\..\data\dinput8.dll" || exit /b 1

      # Fails unless data/d3d9.dll, data/xinput1_3.dll, data/winmm.dll and data/dinput8.dll are PE32
      # DLLs for x86 (the games are 32-bit), xinput1_3.dll keeps the ordinals the games import it by,
      # winmm.dll exports as many functions as tools/make_winmm_exports.py listed, and dinput8.dll
      # the six of Windows' own.
      - name: Verify the DLLs
        id: verify
        shell: pwsh
        env:
          VS: ${{ steps.vs.outputs.path }}
        run: |
          function Fail([string] $message) {
            Write-Output "::error::$message"
            exit 1
          }
          foreach ($name in 'd3d9.dll', 'xinput1_3.dll', 'winmm.dll', 'dinput8.dll') {
            $dll = "data\$name"
            if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { Fail "data/$($name): not produced by the build." }

            $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $dll))
            if ($bytes.Length -lt 0x40 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { Fail "$($name): no MZ header." }
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($pe -lt 0x40 -or $pe + 28 -gt $bytes.Length) { Fail "$($name): truncated PE header." }
            if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x00004550) { Fail "$($name): no PE signature." }
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            $characteristics = [BitConverter]::ToUInt16($bytes, $pe + 22)
            $magic = [BitConverter]::ToUInt16($bytes, $pe + 24)
            $linker = '{0}.{1:D2}' -f $bytes[$pe + 26], $bytes[$pe + 27]
            if ($machine -ne 0x014C) { Fail ("$($name): machine is 0x{0:X4}, expected 0x014C (x86)." -f $machine) }
            if ($magic -ne 0x010B) { Fail ("$($name): optional header magic is 0x{0:X3}, expected 0x10B (PE32)." -f $magic) }
            if (($characteristics -band 0x2000) -eq 0) { Fail "$($name): IMAGE_FILE_DLL flag not set, this is not a DLL." }

            $sha256 = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText((Join-Path $PWD 'data' "$name.sha256"), "$sha256  $name`n")
            $key = @{ 'd3d9.dll' = 'sha256'; 'xinput1_3.dll' = 'xinput-sha256'; 'winmm.dll' = 'winmm-sha256'; 'dinput8.dll' = 'dinput8-sha256' }[$name]
            "$key=$sha256" >> $env:GITHUB_OUTPUT

            $size = $bytes.Length
            $info = (Get-Item -LiteralPath $dll).VersionInfo
            Write-Output "$($name): PE32 DLL, x86, linker $linker, $size bytes, $($info.ProductName) $($info.FileVersion), SHA-256 $sha256"
            @(
              "### $name (Release | Win32)"
              ''
              '| | |'
              '|---|---|'
              "| Product | $($info.ProductName) $($info.FileVersion) |"
              '| Format | PE32 DLL, x86 (32-bit) |'
              "| Linker | $linker |"
              ('| Size | {0:N0} bytes ({1:N0} KiB) |' -f $size, [math]::Round($size / 1KB))
              "| SHA-256 | ``$sha256`` |"
              "| Commit | ``$env:GITHUB_SHA`` |"
              ''
            ) -join "`n" >> $env:GITHUB_STEP_SUMMARY
          }

          # HP5, HP6 and both Deathly Hallows import xinput1_3.dll BY ORDINAL: a function at
          # another number would be a different function.
          $dumpbin = Get-ChildItem "$env:VS\VC\Tools\MSVC\*\bin\Hostx64\x86\dumpbin.exe" | Select-Object -Last 1
          $exports = & $dumpbin.FullName /nologo /exports data\xinput1_3.dll
          $want = @{ 2 = 'XInputGetState'; 3 = 'XInputSetState'; 4 = 'XInputGetCapabilities'; 5 = 'XInputEnable'
                     6 = 'XInputGetDSoundAudioDeviceGuids'; 7 = 'XInputGetBatteryInformation'; 8 = 'XInputGetKeystroke' }
          foreach ($ordinal in $want.Keys) {
            if (-not ($exports | Select-String -Pattern "^\s+$ordinal\s+\S+\s+\S+\s+$($want[$ordinal]) ")) {
              Fail "xinput1_3.dll: $($want[$ordinal]) is not at ordinal $ordinal."
            }
          }
          if (-not ($exports | Select-String -Pattern '^\s+100\s+\S+\s+\[NONAME\]')) { Fail 'xinput1_3.dll: no ordinal 100 (XInputGetStateEx).' }
          Write-Output 'xinput1_3.dll: ordinals 2 to 8 and 100 as in the original.'

          # Every DLL of the game that imports winmm.dll gets ours: one function missing and it
          # fails to load. The count is the one exports.inc was generated with.
          $inc = Get-Content -Raw source/winmm/exports.inc
          if ($inc -notmatch '#define ACCIO_WINMM_EXPORTS (\d+)') { Fail 'source/winmm/exports.inc: no export count.' }
          $want = [int]$Matches[1]
          $winmm = & $dumpbin.FullName /nologo /exports data\winmm.dll
          $line = $winmm | Select-String -Pattern '^\s+(\d+) number of functions' | Select-Object -First 1
          if (-not $line) { Fail 'winmm.dll: no export table.' }
          $count = [int]$line.Matches[0].Groups[1].Value
          if ($count -ne $want) { Fail "winmm.dll exports $count functions, exports.inc lists $want." }
          Write-Output "winmm.dll: $want exports, as many as Windows' own."

          # HP3's WinDrv.dll imports DirectInput8Create; the other five are Windows' own, kept so
          # that nothing else that loads dinput8.dll misses one.
          $dinput8 = & $dumpbin.FullName /nologo /exports data\dinput8.dll
          foreach ($name in 'DirectInput8Create', 'DllCanUnloadNow', 'DllGetClassObject', 'DllRegisterServer', 'DllUnregisterServer', 'GetdfDIJoystick') {
            if (-not ($dinput8 | Select-String -Pattern "\s$name(\s|$)")) { Fail "dinput8.dll: $name not exported." }
          }
          Write-Output "dinput8.dll: the six exports of Windows' own."

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d3d9-win32
          path: |
            data/d3d9.dll
            data/d3d9.dll.sha256
            data/xinput1_3.dll
            data/xinput1_3.dll.sha256
            data/winmm.dll
            data/winmm.dll.sha256
            data/dinput8.dll
            data/dinput8.dll.sha256
          if-no-files-found: error
